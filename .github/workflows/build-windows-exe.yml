name: Build PlanetRead Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

      - name: Install backend and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm planetread.spec

      - name: Self-test the built executable (imports and all models)
        shell: pwsh
        env:
          # Only needs to be non-empty: the pipeline builds its OpenAI client at import.
          OPENAI_API_KEY: self-test-placeholder
        run: |
          & dist/PlanetRead/PlanetRead.exe --self-test --models
          if ($LASTEXITCODE -ne 0) { throw "PlanetRead.exe --self-test failed" }

      - name: Add .env template
        shell: pwsh
        run: Copy-Item backend/.env.example dist/PlanetRead/.env.example

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PlanetRead-Windows
          path: dist/PlanetRead
