name: Build PlanetRead Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

      - name: Install backend and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt pyinstaller

      - name: Pack models (8-bit Florence-2/MERT/PANNs, fp16 MiniLM, Silero)
        shell: pwsh
        run: python tools/pack_models.py

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm planetread.spec

      - name: Remove download caches, so the self-test can only use bundled models
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$HOME/.cache/huggingface", "$HOME/.cache/torch", "$HOME/panns_data" -ErrorAction SilentlyContinue

      - name: Self-test the built executable (imports and all models)
        shell: pwsh
        run: |
          & dist/PlanetRead/PlanetRead.exe --self-test --models
          if ($LASTEXITCODE -ne 0) { throw "PlanetRead.exe --self-test failed" }

      - name: Self-test with the CUDA PyTorch add-on (what "Use NVIDIA GPU" downloads)
        shell: pwsh
        run: |
          & dist/PlanetRead/PlanetRead.exe --install-gpu-torch
          if ($LASTEXITCODE -ne 0) { throw "PlanetRead.exe --install-gpu-torch failed" }
          $out = & dist/PlanetRead/PlanetRead.exe --self-test --models | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "self-test with the CUDA add-on failed" }
          if ($out -notmatch '\+cu121 \(CUDA add-on\)') { throw "the CUDA add-on was not used" }

      - name: Check package size (must stay under 2 GB as Windows shows it)
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/PlanetRead -Recurse -File
          $bytes = ($files | Measure-Object Length -Sum).Sum
          "PlanetRead folder: {0:N2} GB as Windows shows it ({1:N0} bytes)" -f ($bytes / 1GB), $bytes
          "Largest folders:"
          $files | Group-Object { $_.FullName.Substring((Resolve-Path dist/PlanetRead).Path.Length + 1).Split('\')[0..2] -join '\' } |
            ForEach-Object { [pscustomobject]@{ MB = [math]::Round(($_.Group | Measure-Object Length -Sum).Sum / 1MB); Path = $_.Name } } |
            Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize
          if ($bytes -gt 2GB) { throw "PlanetRead folder is over 2 GB" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PlanetRead-Windows
          path: dist/PlanetRead
