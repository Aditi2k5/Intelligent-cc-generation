name: Build PlanetRead Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

      - name: Install backend and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt pyinstaller

      - name: Build one-file executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm planetread.spec

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/PlanetRead.exe release/PlanetRead.exe
          Copy-Item backend/.env.example release/.env.example

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PlanetRead-Windows
          path: release
